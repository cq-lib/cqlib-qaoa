[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "cqlib-algorithm"
version = "0.1.0"
authors = [
    { name = "Tian Yue", email = "tianyue@chinatelecom.cn" }
]
description = "Quantum algorithm package based on Cqlib"
readme = "README.md"
requires-python = ">=3.10.18"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.7.4",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "networkx>=3.4",
  "rustworkx>=0.17.1",
  "sympy>=1.14.0",
  "tabulate>=0.9.0",
  "matplotlib>=3.10.6",
  "openqasm3>=1.0.1",
  "requests>=2.32.5",
  "cqlib>=1.3.5"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Topic :: Scientific/Engineering :: Physics"
]

[tool.hatch.build.targets.wheel]
packages = ["src/cqlib_algorithm"]

[tool.uv]
index-url = "https://pypi.org/simple"

