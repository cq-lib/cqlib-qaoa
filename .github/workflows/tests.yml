name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install package and test dependencies
        # Runtime dependency is cqlib>=1.4.0b1 (PEP 440 of Cargo 1.4.0-beta1).
        # Do not pip-install current PyPI cqlib: cqlib>=0.1.0 resolves to 1.3.11
        # and raises ModuleNotFoundError: cqlib.ir. CI uses --no-deps plus
        # tests/conftest.py until 1.4.0b1 wheels are published, then add a job
        # that installs the real package. cqlib-tianyan is not on PyPI yet;
        # Tianyan tests mock it.
        run: |
          python -m pip install "pytest>=8" "numpy>=2.1" "matplotlib>=3.7.5" "networkx>=3.0" "scipy>=1.11"
          python -m pip install --no-deps .
      - name: Run tests
        run: python -m pytest
